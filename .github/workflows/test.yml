name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"
      - run: zig build fmt
      - run: zig build test
      - run: zig build
      - if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          make checksums
